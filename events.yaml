# Macro event calendar used by the event veto and the morning brief.
#
# The bot opens no new trades on the session BEFORE an event and on the event
# day itself (a daily signal taken the day before is a bet straight into the
# release, and option premiums are inflated going in).
#
# scope:  market        -> every symbol
#         SOXX / XLK ... -> only stocks whose sector ETF matches
#         [AAPL, MSFT]   -> only those tickers
#
# The morning brief warns when the last market-wide event is < 45 days away.
# Keep this file up to date: add tariff deadlines, war deadlines, etc. as they
# are announced. Sources: federalreserve.gov (FOMC), bls.gov/schedule (CPI, jobs).

events:
  # --- 2026 ---
  - {date: 2026-10-28, name: "FOMC rate decision", scope: market}
  - {date: 2026-11-06, name: "Jobs report (Oct)", scope: market}
  - {date: 2026-11-10, name: "CPI (Oct)", scope: market}
  - {date: 2026-12-04, name: "Jobs report (Nov)", scope: market}
  - {date: 2026-12-09, name: "FOMC rate decision + projections", scope: market}
  - {date: 2026-12-10, name: "CPI (Nov)", scope: market}
  # --- 2027 (FOMC dates tentative until the Fed confirms) ---
  - {date: 2027-01-10, name: "US-China trade truce expiry (verify)", scope: market}
  - {date: 2027-01-08, name: "Jobs report (Dec) – tentative", scope: market}
  - {date: 2027-01-13, name: "CPI (Dec)", scope: market}
  - {date: 2027-01-27, name: "FOMC rate decision", scope: market}
  - {date: 2027-02-05, name: "Jobs report (Jan) – tentative", scope: market}
  - {date: 2027-02-11, name: "CPI (Jan)", scope: market}
  - {date: 2027-03-05, name: "Jobs report (Feb) – tentative", scope: market}
  - {date: 2027-03-10, name: "CPI (Feb)", scope: market}
  - {date: 2027-03-17, name: "FOMC rate decision + projections", scope: market}
  - {date: 2027-04-02, name: "Jobs report (Mar) – tentative", scope: market}
  - {date: 2027-04-13, name: "CPI (Mar)", scope: market}
  - {date: 2027-04-28, name: "FOMC rate decision", scope: market}

# Earnings from these companies move their whole sector. Their dates are looked
# up automatically every day; the veto applies to stocks in that sector.
bellwethers:
  SOXX: [NVDA, TSM, AVGO, MU, ASML, AMD]
  XLK: [MSFT, AAPL]
  XLC: [META, GOOGL]
  XLY: [AMZN]
